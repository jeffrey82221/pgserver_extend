name: Build and Test

on:
  pull_request:
  push:
    branches:
      - testing
      - main
  release:
    types:
      - created
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'   # python used to drive cibuildwheel and for the 3.11 test run
  ARTIFACT_PREFIX: python-package-distributions

jobs:
  # ---------------------------------------------------------------------------
  # 1. Per OS: build postgres + pgvector + AGE, package the wheel, then test it
  #    (build and test share one job so each OS proceeds independently)
  # ---------------------------------------------------------------------------
  build_wheels:
    name: Build and test wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            arch: x86_64
            deployment-target: '26.0'
          - os: macos-26
            arch: arm64
            deployment-target: '26.0'
          - os: ubuntu-latest
            arch: x86_64
            deployment-target: ''
          - os: windows-2022
            arch: AMD64
            deployment-target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # extra pythons, only used for the test phase (one fresh venv per python)
      - uses: actions/setup-python@v5
        id: py312
        with: {python-version: '3.12', update-environment: false}
      - uses: actions/setup-python@v5
        id: py313
        with: {python-version: '3.13', update-environment: false}
      - uses: actions/setup-python@v5
        id: py314
        with: {python-version: '3.14', update-environment: false}

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade cibuildwheel

      - name: Install PostgreSQL parser generators (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install winflexbison --yes --no-progress
          echo "BISON=win_bison" >> "$GITHUB_ENV"
          echo "FLEX=win_flex" >> "$GITHUB_ENV"

      # ---- macOS / Windows: build natively so failures show up early ----
      # On Linux cibuildwheel builds inside a manylinux docker container (see CIBW_BEFORE_ALL_LINUX).
      - name: Build PostgreSQL and supported extensions
        if: runner.os != 'Linux'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
        run: make

      - name: Install postgresql client libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install postgresql

      # ---- package ----
      - name: Build wheels
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_SKIP: pp* cp38-* cp3??t-* *-musllinux*
          # Inside the manylinux container: AGE needs flex/bison/readline/zlib, pgsql-http needs libcurl,
          # pgvectorscale needs clang + a rust toolchain (cargo-pgrx is installed by the Makefile)
          CIBW_BEFORE_ALL_LINUX: >
            yum install -y flex bison readline-devel zlib-devel libcurl-devel openssl-devel clang
            && curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
            && make
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ matrix.os }}
          path: wheelhouse/*.whl
          overwrite: true

      # ---- test: for each python, install the wheel into a brand-new virtualenv and run pytest ----
      # --no-index/--find-links makes pip pick the wheel built above that matches the venv's python
      # (never a copy from PyPI); the [test] extra is then resolved against PyPI.
      # Tests run against the installed wheel: the sources in src/ are not importable from the venv.
      - name: Test the wheel in a fresh virtualenv per python version
        shell: bash
        env:
          PY311: python
          PY312: ${{ steps.py312.outputs.python-path }}
          PY313: ${{ steps.py313.outputs.python-path }}
          PY314: ${{ steps.py314.outputs.python-path }}
        run: |
          for PYV in 311 312 313 314; do
            echo "::group::python ${PYV}"
            PYVAR="PY${PYV}"
            VENV="$RUNNER_TEMP/venv-${PYV}"
            "${!PYVAR}" -m venv "$VENV"
            if [ -d "$VENV/Scripts" ]; then BIN="$VENV/Scripts"; else BIN="$VENV/bin"; fi
            "$BIN/python" --version
            "$BIN/python" -m pip install --upgrade pip
            "$BIN/python" -m pip install --no-index --no-deps --find-links wheelhouse pgserver-extend
            "$BIN/python" -m pip install "pgserver-extend[test]"
            "$BIN/python" -m pytest -s -v --log-cli-level=INFO tests
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # 2. Publish (not on pull requests)
  # ---------------------------------------------------------------------------
  publish-to-pypi:
    name: Publish Python dist to PyPI
    if: ${{ github.event_name != 'pull_request' }}
    needs: build_wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pgserver-extend
    permissions:
      id-token: write  # mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ARTIFACT_PREFIX }}-*
          merge-multiple: true
          path: dist/
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
