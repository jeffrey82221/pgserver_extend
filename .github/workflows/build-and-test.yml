name: Build and Test

on:
  pull_request:
  push:
    branches:
      - testing
      - main
  release:
    types:
      - created
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'   # python used to drive cibuildwheel and to run the tests
  ARTIFACT_PREFIX: python-package-distributions

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build postgres + pgvector + AGE and package them into wheels
  # ---------------------------------------------------------------------------
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            arch: x86_64
            deployment-target: '26.0'
          - os: macos-26
            arch: arm64
            deployment-target: '26.0'
          - os: ubuntu-latest
            arch: x86_64
            deployment-target: ''
          - os: windows-2022
            arch: AMD64
            deployment-target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade cibuildwheel

      # ---- toolchain needed by the AGE extension (parser generators) ----
      - name: Install flex and bison (Windows)
        if: runner.os == 'Windows'
        run: C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed flex bison

      # ---- macOS / Windows: build natively so failures show up early ----
      # On Linux cibuildwheel builds inside a manylinux docker container (see CIBW_BEFORE_ALL_LINUX).
      - name: Build postgres, pgvector and age
        if: runner.os != 'Linux'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
        run: make

      - name: Install postgresql client libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install postgresql

      # ---- package ----
      - name: Build wheels
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_SKIP: pp* cp38-* cp3??t-* *-musllinux*
          # AGE needs flex/bison/readline/zlib inside the manylinux container
          CIBW_BEFORE_ALL_LINUX: yum install -y flex bison readline-devel zlib-devel && make
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ matrix.os }}
          path: wheelhouse/*.whl
          overwrite: true

  # ---------------------------------------------------------------------------
  # 2. Install the built wheel into a clean environment and run the test-suite
  # ---------------------------------------------------------------------------
  test_wheels:
    name: Test wheel on ${{ matrix.os }}
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, macos-26, ubuntu-latest, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download wheels built on ${{ matrix.os }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ matrix.os }}
          path: wheelhouse/

      # --no-index/--find-links makes pip pick the wheel built above that matches this python
      # (never a copy from PyPI); the [test] extra is then resolved against PyPI.
      - name: Install the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --no-deps --find-links wheelhouse pgserver-extend
          python -m pip install "pgserver-extend[test]"

      # Tests run against the installed wheel: the checkout only provides tests/,
      # the sources in src/ are not importable from there.
      - name: Run pytest
        run: python -m pytest -s -v --log-cli-level=INFO tests

  # ---------------------------------------------------------------------------
  # 3. Publish (not on pull requests)
  # ---------------------------------------------------------------------------
  publish-to-pypi:
    name: Publish Python dist to PyPI
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - build_wheels
      - test_wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pgserver-extend
    permissions:
      id-token: write  # mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ARTIFACT_PREFIX }}-*
          merge-multiple: true
          path: dist/
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
